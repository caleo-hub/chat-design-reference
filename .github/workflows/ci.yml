name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-design-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: make verify
      - name: Validate OpenAPI YAML parses
        run: uv run --locked python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('contracts/openapi.yaml').read_text())"

name: Bootstrap uv lockfile

on:
  push:
    branches:
      - feat/reference-architecture-v1
    paths:
      - pyproject.toml
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv lock
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: add reproducible uv lockfile [skip ci]"
          git push

[project]
name = "chat-design-reference"
version = "0.1.0"
description = "Reference modular-monolith architecture for professional AI chats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.1,<3",
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_design_reference"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chat_design_reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["chat_design_reference"]

[[tool.importlinter.contracts]]
name = "Core must not depend on API or composition root"
type = "forbidden"
source_modules = ["chat_design_reference.core"]
forbidden_modules = [
  "chat_design_reference.api",
  "chat_design_reference.bootstrap",
]
